[package]
name = "ops-lib"
version = "0.1.0"
edition = "2024"
description = "Reader/writer for the Open Productivity Standard (OPS)"
license = "MIT"
repository = "https://github.com/aricma/open-productivity-spec"

[lib]
path = "lib.rs"

[lints.rust]
unsafe_code = "deny"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[[test]]
name = "corpus"
path = "../tests/corpus.rs"

[[test]]
name = "model"
path = "../tests/model.rs"
