[package]
name = "ops-lib"
version = "0.1.0"
edition = "2024"
description = "Reader/writer for the Open Productivity Standard (OPS)"
license = "MIT"
repository = "https://github.com/aricma/open-productivity-spec"

[lib]
path = "lib/lib.rs"

[lints]
workspace = true

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"

[[test]]
name = "essentials"
path = "tests/essentials/main.rs"

[[test]]
name = "security"
path = "tests/security/main.rs"

[[test]]
name = "performance"
path = "tests/performance/main.rs"
