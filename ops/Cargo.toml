[package]
name = "ops-lib"
version = "0.1.0"
edition = "2024"
description = "Reader/writer for the Open Productivity Standard (OPS)"
license = "MIT"
repository = "https://github.com/aricma/open-productivity-spec"

[lib]
path = "lib/lib.rs"

[lints]
workspace = true

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { version = "0.9", optional = true }

[features]
# One feature per format, defaulting to all of them. A build without a format
# does not claim it: the `Format` variant is gone and so is the code that reads
# it, which is what lets `yaml` be the only format that pulls a parser in.
default = ["json", "yaml", "jsonl", "csv"]
json = []
jsonl = []
csv = []
yaml = ["dep:serde_yaml"]

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"
# The corpus and its generated tests cover every format, so they need them all.
required-features = ["json", "yaml", "jsonl", "csv"]

[[test]]
name = "essentials"
path = "tests/essentials/main.rs"
required-features = ["json", "yaml", "jsonl", "csv"]

[[test]]
name = "security"
path = "tests/security/main.rs"
required-features = ["json", "yaml", "jsonl", "csv"]

[[test]]
name = "performance"
path = "tests/performance/main.rs"
required-features = ["json", "yaml", "jsonl", "csv"]
