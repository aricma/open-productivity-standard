[package]
name = "ops-lib"
version = "0.1.0"
edition = "2024"
description = "Reader/writer for the Open Productivity Standard (OPS)"
license = "MIT"
repository = "https://github.com/aricma/open-productivity-spec"
# Every target is declared below: the per-format ones live in subdirectories of
# `tests/features/`, which auto-discovery would take for targets of their own.
autotests = false

[lib]
path = "lib/lib.rs"

[lints]
workspace = true

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { version = "0.9", optional = true }

[features]
# One feature per format, defaulting to all of them. A build without a format
# does not claim it: the `Format` variant is gone and so is the code that reads
# it, which is what lets `yaml` be the only format that pulls a parser in.
default = ["json", "yaml", "jsonl", "csv"]
json = []
jsonl = []
csv = []
yaml = ["dep:serde_yaml"]

[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"
# The corpus and its generated tests cover every format, so they need them all.
required-features = ["json", "yaml", "jsonl", "csv"]

[[test]]
name = "essentials"
path = "tests/essentials/main.rs"
required-features = ["json", "yaml", "jsonl", "csv"]

[[test]]
name = "security"
path = "tests/security/main.rs"
required-features = ["json", "yaml", "jsonl", "csv"]

[[test]]
name = "performance"
path = "tests/performance/main.rs"
required-features = ["json", "yaml", "jsonl", "csv"]

# One target per format, so a subset build runs the format it has. A target whose
# feature is off is not built at all, which is why the claim each build makes
# about the formats it does not have is asserted from inside the enabled one.
[[test]]
name = "feature-json"
path = "tests/features/json/main.rs"
required-features = ["json"]

[[test]]
name = "feature-yaml"
path = "tests/features/yaml/main.rs"
required-features = ["yaml"]

[[test]]
name = "feature-jsonl"
path = "tests/features/jsonl/main.rs"
required-features = ["jsonl"]

[[test]]
name = "feature-csv"
path = "tests/features/csv/main.rs"
required-features = ["csv"]
