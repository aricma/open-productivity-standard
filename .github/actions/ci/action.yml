name: OPS CI
description: Format, lint, test, and document the ops workspace.

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - shell: bash
      run: cargo fmt --check
    - shell: bash
      run: cargo run -q -p gen-corpus -- --check
    - shell: bash
      run: |
        # A reader for a small model has no business being megabytes. The mask's
        # `build` step documents why the budget is 2 MiB; this keeps the gate on
        # the runners too, where a new heavyweight dependency would show up.
        cargo build --release -p ops-lib
        rlib=$(ls target/release/libops_lib.rlib 2>/dev/null || ls target/release/ops_lib.rlib)
        size=$(wc -c < "$rlib" | tr -d ' ')
        budget=$((2 * 1024 * 1024))
        printf 'ops-lib rlib: %s bytes (budget %s)\n' "$size" "$budget"
        if [ "$size" -gt "$budget" ]; then
          echo 'the compiled library outgrew its budget' >&2
          exit 1
        fi
    - shell: bash
      run: cargo check --all-targets --all-features
    - shell: bash
      run: cargo clippy --all-targets --all-features -- -D warnings
    - shell: bash
      run: |
        # Every format is a cargo feature, and each has to build on its own.
        for feature in json yaml jsonl csv; do
          cargo clippy -q -p ops-lib --no-default-features --features "$feature" --all-targets -- -D warnings
          cargo test -q -p ops-lib --no-default-features --features "$feature"
          echo "ops-lib builds and passes with only $feature"
        done
        # A reader and a writer with no format refuses to build, and says so.
        if cargo check -q -p ops-lib --no-default-features 2>/dev/null; then
          echo 'ops-lib built with no format enabled' >&2
          exit 1
        fi
    # Every target but `performance`: the timing tripwire needs a quiet
    # machine, and a shared runner is not one. It runs in `mask ci` and
    # `mask test --profile performance`.
    - shell: bash
      run: |
        cargo test --lib --test essentials
        cargo test -p gen-corpus
        cargo test --doc
        cargo test -p ops-lib --test acceptance
        cargo test -p ops-lib --test security
    - shell: bash
      run: cargo doc --no-deps --all-features
      env:
        RUSTDOCFLAGS: "-D warnings"
