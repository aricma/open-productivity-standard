[workspace]
members = ["ops", "tools/gen-corpus"]
resolver = "3"

# Deny `unsafe` for everything in the workspace: the reader, the writer, and the
# tools that generate their tests. A member opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"

# See clippy.toml: no library code asks the machine for its parallelism.
[workspace.lints.clippy]
disallowed_methods = "deny"
